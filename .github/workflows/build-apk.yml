name: Build Dapic DSP APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build Debug APK
        run: |
          set -e
          curl -fsSL https://services.gradle.org/distributions/gradle-7.5.1-bin.zip -o gradle.zip
          unzip -q gradle.zip
          set +e
          ./gradle-7.5.1/bin/gradle assembleDebug --no-daemon > build.log 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== KEY FAILURE LINES ==="
            grep -E "e:|error:|AAPT:|Caused by:|What went wrong:|Execution failed for task" build.log | tail -n 30
            exit $EXIT_CODE
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dapic-dsp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
